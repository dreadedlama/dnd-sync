name: Build for Android

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      # -------------------------
      # Build & Sign MOBILE
      # -------------------------

      - name: Build mobile
        run: ./gradlew :mobile:assembleRelease

      - name: Sign mobile APK
        id: sign_mobile
        uses: zacharee/zipalign-sign-android-release@2.0.0
        with:
          releaseDirectory: mobile/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_SIGNING_KEY_PWD }}
          keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PWD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Rename mobile APK
        run: |
          mv "${{ steps.sign_mobile.outputs.signedReleaseFile }}" \
             "${{ github.workspace }}/mobile-release.apk"

      - name: Upload mobile APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release
          path: mobile-release.apk

      # -------------------------
      # Build & Sign WEAR
      # -------------------------

      - name: Build wear
        run: ./gradlew :wear:assembleRelease

      - name: Sign wear APK
        id: sign_wear
        uses: zacharee/zipalign-sign-android-release@2.0.0
        with:
          releaseDirectory: wear/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_SIGNING_KEY_PWD }}
          keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PWD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Rename wear APK
        run: |
          mv "${{ steps.sign_wear.outputs.signedReleaseFile }}" \
             "${{ github.workspace }}/wear-release.apk"

      - name: Upload wear APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wear-release
          path: wear-release.apk

      # -------------------------
      # Attach APKs to GitHub Release
      # Only runs for published releases
      # -------------------------

      - name: Attach APKs to release
        if: github.event_name == 'release'
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            mobile-release.apk
            wear-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          tag: ${{ github.event.release.tag_name }}